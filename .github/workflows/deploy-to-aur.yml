name: Sync upstream to AUR

on:
  workflow_dispatch:
  schedule:
    - cron: "40 11 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel

    defaults:
      run:
        working-directory: ${{ github.workspace }}

    env:
      UPSTREAM_URL: https://github.com/zDEFz/c2-patch.git
      MAIN_BRANCH: stable
      AUR_PUSH_URL: ssh://aur@aur.archlinux.org/cultris2-git.git

    steps:
      - name: Install deps
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm git openssh bash

      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: stable

      - name: Prepare SSH for GitHub
        run: |
          set -euo pipefail
          mkdir -p /root/.ssh
          chmod 700 /root/.ssh
          echo "${{ secrets.GH_DEPLOY_KEY }}" > /root/.ssh/github
          chmod 600 /root/.ssh/github
          ssh-keyscan -t ed25519,rsa github.com > /root/.ssh/known_hosts_github
          chmod 644 /root/.ssh/known_hosts_github

      - name: Prepare SSH for AUR
        run: |
          set -euo pipefail
          mkdir -p /root/.ssh
          echo "${{ secrets.AUR_SSH_PRIVATE_KEY }}" > /root/.ssh/aur
          chmod 600 /root/.ssh/aur
          echo "${{ vars.SSH_CONFIG }}" > /root/.ssh/config
          chmod 600 /root/.ssh/config
          ssh-keyscan -t ed25519,rsa aur.archlinux.org > /root/.ssh/known_hosts
          chmod 644 /root/.ssh/known_hosts

      - name: Clone upstream
        id: ver
        run: |
          set -euo pipefail
          rm -rf /tmp/upstream
          git clone --filter=blob:none "$UPSTREAM_URL" /tmp/upstream
          cd /tmp/upstream
          COMMIT="$(git rev-parse HEAD)"
          SHORT="$(git rev-parse --short HEAD)"
          COUNT="$(git rev-list --count HEAD)"
          VERSION="r${COUNT}.${SHORT}"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Update linux-only payload from upstream
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          copy_dir() {
            local src="/tmp/upstream/$1"
            local dst="$GITHUB_WORKSPACE/$1"
            if [ -d "$src" ]; then
              rm -rf "$dst"
              mkdir -p "$(dirname "$dst")"
              cp -a "$src" "$dst"
            fi
          }

          copy_file() {
            local src="/tmp/upstream/$1"
            local dst="$GITHUB_WORKSPACE/$1"
            if [ -f "$src" ]; then
              mkdir -p "$(dirname "$dst")"
              cp -f "$src" "$dst"
            fi
          }

          copy_dir "resources/libs" "libs"
          copy_dir "settings" "settings"
          copy_file "cultris2.jar" "cultris2.jar"

      - name: Commit upstream payload update (if any)
        env:
          GIT_SSH_COMMAND: ssh -i /root/.ssh/github -o UserKnownHostsFile=/root/.ssh/known_hosts_github -o StrictHostKeyChecking=yes
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"

          git remote set-url origin "git@github.com:${GITHUB_REPOSITORY}.git"

          git config user.name "gh_actions_upstream"
          git config user.email "grubyogon10@gmail.com"

          if git diff --quiet; then
            exit 0
          fi

          git add -A
          git commit -m "sync: linux-only payload ${{ steps.ver.outputs.version }}"
          git push origin "${MAIN_BRANCH}"

      - name: Update PKGBUILD and regenerate .SRCINFO
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          test -f PKGBUILD
          test -d .git

          NEW_COMMIT="${{ steps.ver.outputs.commit }}"
          NEW_VER="${{ steps.ver.outputs.version }}"

          if grep -qE "^_commit=${NEW_COMMIT}$" PKGBUILD && grep -qE "^pkgver=${NEW_VER}$" PKGBUILD; then
            :
          else
            if grep -qE "^_commit=" PKGBUILD; then
              sed -i "s/^_commit=.*/_commit=${NEW_COMMIT}/" PKGBUILD
            else
              sed -i "1i _commit=${NEW_COMMIT}" PKGBUILD
            fi

            if grep -qE "^pkgver=" PKGBUILD; then
              sed -i "s/^pkgver=.*/pkgver=${NEW_VER}/" PKGBUILD
            else
              printf "pkgver=%s\n" "$NEW_VER" >> PKGBUILD
            fi

            if grep -qE "^pkgrel=" PKGBUILD; then
              sed -i "s/^pkgrel=.*/pkgrel=1/" PKGBUILD
            else
              echo "pkgrel=1" >> PKGBUILD
            fi
          fi

          id -u builder >/dev/null 2>&1 || useradd -m -u 1000 builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          su - builder -c "cd '$GITHUB_WORKSPACE' && makepkg --printsrcinfo" > .SRCINFO

      - name: Commit packaging bump (if any)
        env:
          GIT_SSH_COMMAND: ssh -i /root/.ssh/github -o UserKnownHostsFile=/root/.ssh/known_hosts_github -o StrictHostKeyChecking=yes
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"

          git remote set-url origin "git@github.com:${GITHUB_REPOSITORY}.git"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet; then
            exit 0
          fi

          git add PKGBUILD .SRCINFO
          git commit -m "bump: upstream ${{ steps.ver.outputs.version }}"
          git push origin "${MAIN_BRANCH}"

      - name: Push to AUR
        env:
          GIT_SSH_COMMAND: ssh -F /root/.ssh/config -o UserKnownHostsFile=/root/.ssh/known_hosts -o StrictHostKeyChecking=yes
        run: |
          set -euo pipefail
          rm -rf /tmp/aur
          git clone "$AUR_PUSH_URL" /tmp/aur
          cd /tmp/aur
          cp -f "$GITHUB_WORKSPACE/PKGBUILD" .
          cp -f "$GITHUB_WORKSPACE/.SRCINFO" .
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add PKGBUILD .SRCINFO
          git commit -m "bump: upstream ${{ steps.ver.outputs.version }}" || exit 0
          git push

