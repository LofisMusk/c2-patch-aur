name: Sync upstream to AUR

on:
  workflow_dispatch:
  schedule:
    - cron: "40 11 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel

    defaults:
      run:
        working-directory: ${{ github.workspace }}

    env:
      UPSTREAM_REPO: zDEFz/c2-patch
      UPSTREAM_URL: https://github.com/zDEFz/c2-patch.git
      AUR_PKG_NAME: cultris2-git
      AUR_PUSH_URL: ssh://aur@aur.archlinux.org/cultris2-git.git

    steps:
      - name: Install deps
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm git openssh

      - name: Checkout packaging repo (this repo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare SSH for AUR
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.AUR_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H aur.archlinux.org >> ~/.ssh/known_hosts

      - name: Compute upstream version (revcount + shorthash)
        id: ver
        run: |
          set -euo pipefail
          rm -rf /tmp/upstream
          git clone --filter=blob:none --no-checkout "$UPSTREAM_URL" /tmp/upstream
          cd /tmp/upstream
          git checkout -q HEAD

          COMMIT="$(git rev-parse HEAD)"
          SHORT="$(git rev-parse --short HEAD)"
          COUNT="$(git rev-list --count HEAD)"
          VERSION="r${COUNT}.${SHORT}"

          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Update PKGBUILD and regenerate .SRCINFO (non-root)
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          test -f PKGBUILD
          test -d .git

          NEW_COMMIT="${{ steps.ver.outputs.commit }}"
          NEW_VER="${{ steps.ver.outputs.version }}"

          if grep -qE "^_commit=${NEW_COMMIT}$" PKGBUILD && grep -qE "^pkgver=${NEW_VER}$" PKGBUILD; then
            exit 0
          fi

          if grep -qE "^_commit=" PKGBUILD; then
            sed -i "s/^_commit=.*/_commit=${NEW_COMMIT}/" PKGBUILD
          else
            sed -i "1i _commit=${NEW_COMMIT}" PKGBUILD
          fi

          if grep -qE "^pkgver=" PKGBUILD; then
            sed -i "s/^pkgver=.*/pkgver=${NEW_VER}/" PKGBUILD
          else
            printf "pkgver=%s\n" "$NEW_VER" >> PKGBUILD
          fi

          if grep -qE "^pkgrel=" PKGBUILD; then
            sed -i "s/^pkgrel=.*/pkgrel=1/" PKGBUILD
          else
            echo "pkgrel=1" >> PKGBUILD
          fi

          id -u builder >/dev/null 2>&1 || useradd -m -u 1000 builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          su - builder -c "cd '$GITHUB_WORKSPACE' && makepkg --printsrcinfo" > .SRCINFO

      - name: Commit changes (if any)
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          test -d .git

          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet; then
            exit 0
          fi

          git add PKGBUILD .SRCINFO
          git commit -m "bump: upstream ${{ steps.ver.outputs.version }}"


      - name: Test SSH to AUR
        run: |
          ssh -T aur@aur.archlinux.org || true

      - name: Push to AUR
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          test -d .git

          if ! git log -1 --pretty=%B | grep -q "^bump: upstream "; then
            exit 0
          fi

          rm -rf /tmp/aur
          git clone ssh://aur@aur.archlinux.org/cultris2-git.git /tmp/aur
          cd /tmp/aur

          cp -f "$GITHUB_WORKSPACE/PKGBUILD" .
          cp -f "$GITHUB_WORKSPACE/.SRCINFO" .

          git config user.name "github-actions"
          git config user.email "grubyogon10@gmail.com"

          git add PKGBUILD .SRCINFO
          git commit -m "bump: upstream ${{ steps.ver.outputs.version }}" || exit 0
          git push
