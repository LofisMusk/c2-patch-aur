name: Deploy to AUR

on:
  push:
    branches: 
      - stable

jobs:
  deploy:
    runs-on: ubuntu-latest
    container: archlinux:latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    - name: Download dependencies
      run: |
        pacman -Sy --noconfirm base-devel git openssh

    - name: Check if secret is loaded
      run: |
        if [ -z "${{ secrets.AUR_SSH_PRIVATE_KEY }}" ]; then
        echo "❌ Secret is empty or missing"
        exit 1
        else
        echo "✅ Secret exists and is loaded"
        echo "Length: $(echo "${{ secrets.AUR_SSH_PRIVATE_KEY }}" | wc -c) characters"
        fi

    - name: Set up SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.AUR_SSH_PRIVATE_KEY }}" > ~/.ssh/aur
        chmod 600 ~/.ssh/aur
        echo "${{ vars.SSH_CONFIG }}" > ~/.ssh/config
        chmod 600 ~/.ssh/config
        ssh-keyscan -t rsa aur.archlinux.org >> ~/.ssh/known_hosts
        chmod 644 ~/.ssh/known_hosts

    - name: Test SSH connection
      run: ssh -T aur@aur.archlinux.org || true

    - name: Clone AUR repo
      run: |
        git clone ssh://aur@aur.archlinux.org/cultris2-git aur-repo
        cp -r ./* aur-repo/
        cd aur-repo
        git config user.name "GitHub Action"
        git config user.email "action@github.com"
        git add .
        git commit -m "Update from GitHub: ${{ github.sha }}" || echo "Nothing to commit"
        git push
