name: Sync upstream to AUR

on:
  workflow_dispatch:
  schedule:
    - cron: "40 11 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel

    defaults:
      run:
        working-directory: ${{ github.workspace }}

    env:
      UPSTREAM_URL: https://github.com/zDEFz/c2-patch.git
      MIRROR_BRANCH: upstream-mirror
      MAIN_BRANCH: stable
      AUR_PUSH_URL: ssh://aur@aur.archlinux.org/cultris2-git.git

    steps:
      - name: Install deps
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm git openssh bash

      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare SSH for GitHub
        run: |
          set -euo pipefail
          mkdir -p /root/.ssh
          chmod 700 /root/.ssh
          echo "${{ secrets.GH_DEPLOY_KEY }}" > /root/.ssh/github
          chmod 600 /root/.ssh/github
          ssh-keyscan -t ed25519,rsa github.com > /root/.ssh/known_hosts_github
          chmod 644 /root/.ssh/known_hosts_github

      - name: Prepare SSH for AUR
        run: |
          set -euo pipefail
          mkdir -p /root/.ssh
          echo "${{ secrets.AUR_SSH_PRIVATE_KEY }}" > /root/.ssh/aur
          chmod 600 /root/.ssh/aur
          echo "${{ vars.SSH_CONFIG }}" > /root/.ssh/config
          chmod 600 /root/.ssh/config
          ssh-keyscan -t ed25519,rsa aur.archlinux.org > /root/.ssh/known_hosts
          chmod 644 /root/.ssh/known_hosts

      - name: Sync upstream to mirror branch
        env:
          GIT_SSH_COMMAND: ssh -i /root/.ssh/github -o UserKnownHostsFile=/root/.ssh/known_hosts_github -o StrictHostKeyChecking=yes
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git remote set-url origin "git@github.com:${GITHUB_REPOSITORY}.git"
          git remote add upstream "$UPSTREAM_URL" || true
          git fetch upstream
          git checkout -B "${MIRROR_BRANCH}" upstream/HEAD
          git push origin "${MIRROR_BRANCH}" --force

      - name: Merge mirror into main and trim
        env:
          GIT_SSH_COMMAND: ssh -i /root/.ssh/github -o UserKnownHostsFile=/root/.ssh/known_hosts_github -o StrictHostKeyChecking=yes
        run: |
          set -euo pipefail
          git checkout "${MAIN_BRANCH}"
          git pull origin "${MAIN_BRANCH}"
          git merge --no-ff -m "sync upstream" "${MIRROR_BRANCH}" || true
          bash scripts/trim_upstream.sh
          if git diff --quiet; then exit 0; fi
          git add -A
          git commit -m "trim: linux-only upstream sync"
          git push origin "${MAIN_BRANCH}"

      - name: Compute upstream version
        id: ver
        run: |
          set -euo pipefail
          git checkout "${MIRROR_BRANCH}"
          COMMIT="$(git rev-parse HEAD)"
          SHORT="$(git rev-parse --short HEAD)"
          COUNT="$(git rev-list --count HEAD)"
          VERSION="r${COUNT}.${SHORT}"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          git checkout "${MAIN_BRANCH}"

      - name: Update PKGBUILD and regenerate .SRCINFO
        run: |
          set -euo pipefail
          NEW_COMMIT="${{ steps.ver.outputs.commit }}"
          NEW_VER="${{ steps.ver.outputs.version }}"
          if grep -qE "^_commit=${NEW_COMMIT}$" PKGBUILD && grep -qE "^pkgver=${NEW_VER}$" PKGBUILD; then exit 0; fi
          sed -i "s/^_commit=.*/_commit=${NEW_COMMIT}/" PKGBUILD
          sed -i "s/^pkgver=.*/pkgver=${NEW_VER}/" PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/" PKGBUILD || echo "pkgrel=1" >> PKGBUILD
          id -u builder >/dev/null 2>&1 || useradd -m -u 1000 builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          su - builder -c "cd '$GITHUB_WORKSPACE' && makepkg --printsrcinfo" > .SRCINFO

      - name: Commit packaging bump
        env:
          GIT_SSH_COMMAND: ssh -i /root/.ssh/github -o UserKnownHostsFile=/root/.ssh/known_hosts_github -o StrictHostKeyChecking=yes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then exit 0; fi
          git add PKGBUILD .SRCINFO
          git commit -m "bump: upstream ${{ steps.ver.outputs.version }}"
          git push origin "${MAIN_BRANCH}"

      - name: Push to AUR
        env:
          GIT_SSH_COMMAND: ssh -F /root/.ssh/config -o UserKnownHostsFile=/root/.ssh/known_hosts -o StrictHostKeyChecking=yes
        run: |
          set -euo pipefail
          rm -rf /tmp/aur
          git clone "$AUR_PUSH_URL" /tmp/aur
          cd /tmp/aur
          cp -f "$GITHUB_WORKSPACE/PKGBUILD" .
          cp -f "$GITHUB_WORKSPACE/.SRCINFO" .
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add PKGBUILD .SRCINFO
          git commit -m "bump: upstream ${{ steps.ver.outputs.version }}" || exit 0
          git push
